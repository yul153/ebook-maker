<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#1b1d21">
<title>이북</title>
<meta name="description" content="이북 보기">
<meta property="og:type" content="article">
<meta property="og:title" content="이북">
<meta property="og:description" content="이북 보기">
<meta property="og:image" content="./pages/base/1.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="./pages/thumb/1.webp">
<link rel="preload" as="fetch" href="./manifest.json" crossorigin>
<link rel="stylesheet" href="./viewer.css">
</head>
<body>

<div id="app" class="loading">

  <!-- 상단 바 -->
  <header id="bar">
    <div class="bar-left">
      <button class="tool" data-panel="toc"    title="목차 (C)"   aria-label="목차">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button class="tool" data-panel="thumbs" title="쪽 미리보기 (T)" aria-label="쪽 미리보기">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
      <button class="tool" data-panel="search" title="검색 (F)"   aria-label="검색">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    </div>

    <h1 id="title">이북</h1>

    <div class="bar-right">
      <!-- 아이콘은 setPlaying()이 갈아 끼운다. 두 개를 넣고 CSS로 감추면
           스타일이 하나라도 어긋났을 때 재생·정지가 동시에 보인다. -->
      <button class="tool" id="btn-play" title="자동 넘김 (S)" aria-label="자동 넘김" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
      <button class="tool" id="btn-zoom-out" title="축소 (−)" aria-label="축소">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/></svg></button>
      <span id="zoom-level">100%</span>
      <button class="tool" id="btn-zoom-in" title="확대 (+)" aria-label="확대">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-3.5-3.5"/></svg></button>
      <button class="tool" id="btn-spread" title="한 쪽 / 두 쪽 보기 (D)" aria-label="보기 전환">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M12 4v16"/></svg></button>
      <button class="tool" id="btn-bookmark" title="북마크 (B)" aria-label="북마크" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></button>
      <button class="tool" id="btn-print" title="이 쪽 인쇄 (P)" aria-label="인쇄">
        <svg viewBox="0 0 24 24"><path d="M7 9V4h10v5M7 19H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="15" width="10" height="5"/></svg></button>
      <button class="tool" id="btn-full" title="전체화면 (F11)" aria-label="전체화면">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>

  <!-- 책 무대 -->
  <main id="stage" tabindex="0">
    <div id="viewport">
      <div id="book">
        <div class="slot" id="slot-left"><img alt=""><div class="linklayer"></div><div class="hl"></div></div>
        <div class="slot" id="slot-right"><img alt=""><div class="linklayer"></div><div class="hl"></div></div>
        <div id="spine"></div>
      </div>
    </div>

    <button class="nav prev" id="btn-prev" aria-label="이전 쪽">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="nav next" id="btn-next" aria-label="다음 쪽">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </main>

  <!-- 하단 페이지 이동 -->
  <footer id="pager">
    <button class="tool" id="btn-first" title="처음으로" aria-label="처음으로">
      <svg viewBox="0 0 24 24"><path d="M18 5l-7 7 7 7M6 5v14"/></svg></button>
    <input type="range" id="slider" min="1" value="1" step="1" aria-label="쪽 이동">
    <button class="tool" id="btn-last" title="마지막으로" aria-label="마지막으로">
      <svg viewBox="0 0 24 24"><path d="M6 5l7 7-7 7M18 5v14"/></svg></button>
    <span id="pageno"><input id="pageinput" type="text" inputmode="numeric" value="1" aria-label="쪽 번호"> / <b id="pagetotal">–</b></span>
  </footer>

  <!-- 패널: 목차 · 북마크 -->
  <aside class="panel" id="panel-toc" hidden>
    <div class="panel-head"><h2>목차</h2><button class="close" aria-label="닫기">✕</button></div>
    <div class="panel-body">
      <h3 class="sec">북마크</h3>
      <ul id="bm-list"></ul>
      <h3 class="sec">목차</h3>
      <ol id="toc-list"></ol>
    </div>
  </aside>

  <!-- 패널: 썸네일 -->
  <aside class="panel" id="panel-thumbs" hidden>
    <div class="panel-head"><h2>쪽 미리보기</h2><button class="close" aria-label="닫기">✕</button></div>
    <div class="panel-body"><div id="thumb-grid"></div></div>
  </aside>

  <!-- 패널: 검색 -->
  <aside class="panel" id="panel-search" hidden>
    <div class="panel-head"><h2>검색</h2><button class="close" aria-label="닫기">✕</button></div>
    <div class="panel-search-box">
      <input id="search-input" type="search" placeholder="본문에서 찾기…" autocomplete="off">
    </div>
    <div class="panel-body"><div id="search-results"><p class="hint">검색어를 입력하세요.</p></div></div>
  </aside>

  <div id="scrim"></div>
  <div id="loader"><div class="spinner"></div><span>불러오는 중…</span></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<!-- 인쇄 전용 영역. 화면에는 안 보이고, 인쇄할 때만 이 안의 쪽이 찍힌다. -->
<div id="printarea" aria-hidden="true"></div>

<script src="./viewer.js"></script>
</body>
</html>
